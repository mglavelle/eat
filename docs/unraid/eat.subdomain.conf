# SWAG proxy config for "Where should we eat?" -> https://eat.gulu.stream
# Copy to /mnt/user/appdata/swag/nginx/proxy-confs/ and restart SWAG.
# Same style as dnd.subdomain.conf. SWAG runs with host networking, so it reaches
# the app on the server's LAN IP and the app's host port (8766).
server {
    listen 443 ssl;
    server_name eat.gulu.stream;

    # Google Takeout uploads (the .zip, or a Timeline.json) are far bigger than nginx's 1 MB
    # default. Cloudflare's free plan stops uploads at 100 MB before they get here.
    client_max_body_size 100m;

    location / {
        proxy_pass http://192.168.1.230:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;

        # "Ask" answers stream word by word: don't buffer them. The nearby search and a
        # first AI answer can take a while, so don't cut them off at nginx's 60 s default.
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
